    machine: Lathe
    operations: [Sanding, scotchbrite, polishing, steady rest]
    summary: |
      Very important central shaft for the V2 SPM; held ±0.002" over the 6" length

      When I got within about 0.010" of the final diameter, I started taking measurements over 5 points along the length and only sanded/scotchbrited the surface. Needless to say it took a while

  - name: SPM shaft 1
    category: other
    images:
      - /projects/machining/dead_shafts/dead_shafts.jpg
    material: 6061 aluminum
    machine: Lathe
    operations: [Sanding, scotchbrite, polishing]
    summary: |
      The innermost coaxial shaft in the V2 SPM drivetrain. There was only 1 survivor

      This part, all in all, took 4 attempts over 24 hours to get right. Earlier attempts were particularly catastrophic (see 1 and 2), which happened because I designed the shaft with a very thin wall. (I then redesigned it)